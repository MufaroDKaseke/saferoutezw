name: saferoutezw

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: saferoutezw
      POSTGRES_USER: saferoutezw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql/20-enable-postgis.sql:/docker-entrypoint-initdb.d/20-enable-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferoutezw -d saferoutezw"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
