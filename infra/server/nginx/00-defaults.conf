# Managed by infra/server/bootstrap.sh. Loaded in the http context.
server_tokens off;

# Anything that does not name our domain (scans, direct hits on the IP) gets no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
