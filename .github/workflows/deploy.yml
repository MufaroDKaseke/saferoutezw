name: Test and deploy

# Pull requests run the tests only. A push to main runs the tests, builds the web app on the GitHub
# runner (the 2 GB server cannot build it), syncs the result to the server and restarts the app.
# Running the workflow by hand (Actions > Run workflow) deploys from main or nust, whichever branch
# is picked; any other branch runs the tests only. There is one production server, so whichever
# branch deployed last is what is live.
# Production settings live in /opt/saferoutezw/app/.env ON THE SERVER; CI never sends or overwrites it.
#
# Roll back: re-run the workflow of an earlier green commit (Actions > that run > Re-run all jobs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Deploy without running the tests (emergency use only)"
        type: boolean
        default: false

permissions:
  contents: read

# One production deploy at a time; a newer push waits instead of cancelling a deploy half-way.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_HOST: 170.64.173.188
  DEPLOY_USER: saferoute
  DEPLOY_PATH: /opt/saferoutezw/app
  SITE_URL: https://saferoute.momo.co.zw
  # Public host key of the server (not a secret). Pinning it stops a man-in-the-middle from
  # receiving the deploy. Read it from the server with: cat /etc/ssh/ssh_host_ed25519_key.pub
  DEPLOY_KNOWN_HOSTS: "170.64.173.188 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII2SkxaQEVXGLXFGQlmmx9Y3dJbUvQMlS4fSXFe86u7S"

jobs:
  api-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saferoutezw
      POSTGRES_TEST_DB: saferoutezw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API with dev dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Run API tests
        working-directory: apps/api
        run: python -m pytest

  web-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm test

  deploy:
    needs: [api-tests, web-tests]
    # Runs when the tests passed or were deliberately skipped, never for pull requests or other branches.
    # main deploys on push; nust deploys when run manually from the Actions tab (it has no push trigger).
    if: >-
      ${{ !cancelled()
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nust')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the web app
        working-directory: apps/web
        run: |
          # NEXT_PUBLIC_* values are baked into the build; they come from the same file the server uses.
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$GITHUB_WORKSPACE/infra/server/web.env" >> "$GITHUB_ENV"
          set -a; . "$GITHUB_WORKSPACE/infra/server/web.env"; set +a
          npm ci --no-audit --no-fund
          npm run build
          test -f .next/BUILD_ID

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::The DEPLOY_SSH_KEY secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF
          ssh deploy-target 'echo "connected as $(whoami) to $(hostname)"'

      - name: Sync code and the prebuilt web app to the server
        run: |
          # --delete keeps the server tree identical to the repo. Excluded paths are also protected from
          # deletion, so the server's .env, data directory and node_modules survive.
          rsync -az --delete --human-readable --stats \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='/data/' \
            --exclude='node_modules/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.egg-info/' \
            --exclude='.pytest_cache/' \
            --exclude='apps/web/.next/cache/' \
            ./ "deploy-target:$DEPLOY_PATH/"

      - name: Install, migrate and restart on the server
        run: ssh deploy-target "bash $DEPLOY_PATH/infra/server/deploy.sh"

      - name: Smoke test the public site
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "$SITE_URL/backend/health"; then echo; echo "Site is serving."; exit 0; fi
            echo "Attempt $attempt failed; retrying in 5s"; sleep 5
          done
          echo "::error::$SITE_URL/backend/health did not respond after the deploy."
          exit 1

      - name: Remove the SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
