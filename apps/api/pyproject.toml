[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saferoutezw-api"
version = "0.1.0"
description = "SafeRouteZW road safety intelligence API foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "geoalchemy2>=0.17,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "ollama>=0.4,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
